const BASE=[{"name":"CIO","sheet":"CIO Checklist","items":[{"id":"CIO-01","number":1,"category":"Strategy & Business Alignment","item":"IT strategy explicitly mapped to business goals, reviewed at least twice a year","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-02","number":2,"category":"Strategy & Business Alignment","item":"Clear ownership of technology roadmap (cloud, data platforms, ERP/CRM, AI tooling)","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-03","number":3,"category":"Strategy & Business Alignment","item":"Board/exec reporting on IT value delivery, not just uptime metrics","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-04","number":4,"category":"Strategy & Business Alignment","item":"Vendor and platform consolidation reviewed to cut redundant spend","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-05","number":5,"category":"AI & Emerging Tech","item":"Formal AI adoption strategy (not just pilots) with clear use-case prioritization","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-06","number":6,"category":"AI & Emerging Tech","item":"Governance for shadow AI - unsanctioned use of AI tools by staff","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-07","number":7,"category":"AI & Emerging Tech","item":"Policy on AI vendor data handling (does your data train their models?)","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-08","number":8,"category":"AI & Emerging Tech","item":"Budget and plan for AI-driven productivity tools vs. one-off experiments","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-09","number":9,"category":"Infrastructure & Resilience","item":"Cloud cost governance (FinOps) in place, not just cloud adoption","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-10","number":10,"category":"Infrastructure & Resilience","item":"Disaster recovery and business continuity plans tested in last 12 months","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-11","number":11,"category":"Infrastructure & Resilience","item":"Legacy system modernization roadmap with realistic timelines","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-12","number":12,"category":"Infrastructure & Resilience","item":"SaaS sprawl inventory - ownership, access, and redundancy mapped","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-13","number":13,"category":"Data","item":"Data governance framework with clear ownership (not just IT's problem)","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-14","number":14,"category":"Data","item":"Master data quality standards defined for AI/analytics use","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-15","number":15,"category":"Data","item":"Data residency and sovereignty requirements mapped by jurisdiction","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-16","number":16,"category":"People & Culture","item":"Digital literacy / AI literacy programs for the broader workforce","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-17","number":17,"category":"People & Culture","item":"IT talent retention plan given competitive market for cloud/AI/security skills","priority":"Medium","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIO-18","number":18,"category":"People & Culture","item":"Clear escalation path between IT, security, and business units","priority":"High","owner":"CIO","status":"Not Started","notes":"","targetDate":"","evidence":""}]},{"name":"CTO","sheet":"CTO Checklist","items":[{"id":"CTO-01","number":1,"category":"Architecture & Engineering","item":"Technology stack decisions documented with rationale (avoid tool sprawl)","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-02","number":2,"category":"Architecture & Engineering","item":"API-first / composable architecture to support fast integration and AI features","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-03","number":3,"category":"Architecture & Engineering","item":"Technical debt tracked and budgeted for, not perpetually deferred","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-04","number":4,"category":"Architecture & Engineering","item":"Scalability stress-tested against real growth projections","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-05","number":5,"category":"AI & Product","item":"Clear framework for where AI is embedded in product vs. internal tooling","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-06","number":6,"category":"AI & Product","item":"Model evaluation process - accuracy, bias, hallucination risk, cost per call","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-07","number":7,"category":"AI & Product","item":"Versioning and rollback plan for AI features (models change/degrade over time)","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-08","number":8,"category":"AI & Product","item":"IP and data provenance clarity for AI training data used in products","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-09","number":9,"category":"Engineering Practices","item":"CI/CD pipeline maturity with automated security scanning built in (DevSecOps)","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-10","number":10,"category":"Engineering Practices","item":"Code review and quality standards enforced, including for AI-generated code","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-11","number":11,"category":"Engineering Practices","item":"Open-source dependency management - license compliance and vulnerability tracking","priority":"High","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-12","number":12,"category":"Engineering Practices","item":"Engineering velocity metrics tied to actual business outcomes, not just output","priority":"Low","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-13","number":13,"category":"Innovation & Talent","item":"R&D or innovation budget protected from short-term cuts","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-14","number":14,"category":"Innovation & Talent","item":"Build vs. buy vs. partner decisions revisited regularly (esp. AI vendors)","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-15","number":15,"category":"Innovation & Talent","item":"Engineering culture that attracts and retains scarce technical talent","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CTO-16","number":16,"category":"Innovation & Talent","item":"Clear IP protection process for internally built tools and models","priority":"Medium","owner":"CTO","status":"Not Started","notes":"","targetDate":"","evidence":""}]},{"name":"CISO","sheet":"CISO Checklist","items":[{"id":"CIS-01","number":1,"category":"Governance & Risk","item":"Cyber risk expressed in business terms (financial/operational impact) for the board","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-02","number":2,"category":"Governance & Risk","item":"Risk register reviewed quarterly, tied to actual threat intelligence","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-03","number":3,"category":"Governance & Risk","item":"Third-party/vendor risk management program - especially SaaS and AI vendors","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-04","number":4,"category":"Governance & Risk","item":"Cyber insurance coverage reviewed against current risk profile","priority":"Medium","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-05","number":5,"category":"Threat Landscape","item":"Ransomware playbook tested via tabletop exercise in last 6-12 months","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-06","number":6,"category":"Threat Landscape","item":"AI-powered phishing/deepfake threats included in awareness training","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-07","number":7,"category":"Threat Landscape","item":"Supply chain attack exposure mapped (SolarWinds/MOVEit-style scenarios)","priority":"High","owner":"CISO","status":"Not Started","notes":"","targetDate":"","evidence":""},{"id":"CIS-08","number":8,"category":"Threat Landscape","item":"Insider threat program in place, not BASE.push(...EXTENDED);
const STORAGE='cio-cto-ciso-readiness-v2'; const LEGACY_STORAGE='cio-cto-ciso-readiness-v1';
let state=loadState(),page='dashboard',activeSection='CIO',filters={q:'',priority:'All',status:'All',category:'All',owner:'All'};
function loadState(){try{let saved=JSON.parse(localStorage.getItem(STORAGE));if(saved&&Array.isArray(saved.sections))return mergeSections(saved)}catch(e){}try{let old=JSON.parse(localStorage.getItem(LEGACY_STORAGE));if(old&&Array.isArray(old.sections))return mergeSections(old)}catch(e){}return {sections:JSON.parse(JSON.stringify(BASE)),updatedAt:null}}
function mergeSections(saved){let fresh=JSON.parse(JSON.stringify(BASE));for(let sec of fresh){let prior=saved.sections.find(x=>x.name===sec.name);if(prior){sec.items=sec.items.map(baseItem=>{let old=prior.items.find(x=>x.id===baseItem.id);return old?{...baseItem,...old}:baseItem})}}return {sections:fresh,updatedAt:saved.updatedAt||null}}
function save(){state.updatedAt=new Date().toISOString();localStorage.setItem(STORAGE,JSON.stringify(state));}
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function allItems(){return state.sections.flatMap(s=>s.items.map(i=>({...i,section:s.name}))) }
function stats(items=allItems()){let total=items.length,complete=items.filter(i=>i.status==='Complete').length,na=items.filter(i=>i.status==='N/A').length,progress=items.filter(i=>i.status==='In Progress').length;return {total,complete,na,progress,notStarted:items.filter(i=>i.status==='Not Started').length,open:items.filter(i=>!['Complete','N/A'].includes(i.status)).length,pct:total?Math.round(complete/(total-na||1)*100):0,highOpen:items.filter(i=>i.priority==='High'&&!['Complete','N/A'].includes(i.status)).length}}
function sectionByName(n){return state.sections.find(s=>s.name===n)}
function showToast(t){let el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2300)}
function nav(p,section){page=p;if(section)activeSection=section;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p&&(p!=='checklist'||b.dataset.section===activeSection)));$('#crumb').textContent=p==='dashboard'?'Executive dashboard':p==='checklist'?activeSection+' checklist':p==='workflow'?'Build workflow':'Reports & exports';$('#sidebar').classList.remove('open');render()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page,b.dataset.section)));$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
function header(kicker,title,desc,buttons=''){return `<div class="pagehead"><div><div class="eyebrow">${kicker}</div><h1 class="h1">${title}</h1><div class="sub">${desc}</div></div><div class="actions">${buttons}</div></div>`}
function btn(label,act,cls=''){return `<button class="btn ${cls}" data-action="${act}">${label}</button>`}
function render(){let el=$('#content');if(page==='dashboard')el.innerHTML=dashboard();if(page==='checklist')el.innerHTML=checklist();if(page==='workflow')el.innerHTML=workflow();if(page==='reports')el.innerHTML=reports();bind()}
function dashboard(){let a=allItems(),s=stats(a),sections=state.sections;let pcount=['High','Medium','Low'].map(p=>({p,n:a.filter(i=>i.priority===p).length}));return `${header('Leadership overview','Technology readiness dashboard','A consolidated view of 95 original leadership controls plus 74 architecture, assurance, risk, compliance and hardening controls.',btn('Export backup','backup')+btn('Print dashboard','print','primary'))}<div class="grid stats"><div class="card"><div class="staticon">✓</div><div class="statlabel">Overall completion</div><div class="statnum">${s.pct}%</div><div class="statfoot">${s.complete} completed of ${s.total-s.na} applicable items</div></div><div class="card"><div class="staticon">◎</div><div class="statlabel">Items in progress</div><div class="statnum">${s.progress}</div><div class="statfoot">Actively being addressed</div></div><div class="card"><div class="staticon">!</div><div class="statlabel">High-priority open</div><div class="statnum" style="color:#b85b21">${s.highOpen}</div><div class="statfoot">Requires leadership attention</div></div><div class="card"><div class="staticon">▤</div><div class="statlabel">Not started</div><div class="statnum">${s.notStarted}</div><div class="statfoot">Awaiting assessment or action</div></div></div><div class="grid dashgrid"><div class="card"><h2 class="cardtitle">Progress by responsibility</h2><div class="carddesc">Completion excludes items marked N/A.</div>${sections.map(sec=>{let x=stats(sec.items);return `<div class="progressrow"><div class="name">${esc(sec.name)}</div><div class="bar"><span style="width:${x.pct}%"></span></div><div class="pct">${x.pct}%</div></div>`}).join('')}<div class="legend"><span><i class="dot" style="background:#3288e6"></i>Completed</span><span><i class="dot" style="background:#edf1f6"></i>Remaining</span></div></div><div class="card"><h2 class="cardtitle">Priority distribution</h2><div class="carddesc">Original checklist priority classification.</div><div class="prioritygrid">${pcount.map(x=>`<div class="prioritybox"><b class="${x.p.toLowerCase()}">${x.n}</b><small>${x.p} priority</small></div>`).join('')}</div><div class="callout"><b>${s.highOpen} high-priority items remain open.</b><br>Review ownership, evidence and target dates with the relevant leaders.</div></div></div><div class="grid sectiontiles">${sections.map(sec=>{let x=stats(sec.items);return `<div class="card tile" data-goto="${esc(sec.name)}"><div class="tiletop"><span class="tileicon">${({'CIO':'◈','CTO':'⌘','CISO':'⬡','IT Infrastructure':'▤','Cross-Functional':'⇄'})[sec.name]}</span><span class="mini">${sec.items.length} items</span></div><h3>${esc(sec.name)}</h3><p>${x.complete} complete · ${x.open} open</p><strong>${x.pct}%</strong><div class="bar" style="margin-top:8px"><span style="width:${x.pct}%"></span></div></div>`}).join('')}</div><div class="footer">Enterprise Technology, Security & GRC Readiness Hub · Data is stored in this browser unless exported.</div>`}
function checklist(){let sec=sectionByName(activeSection),items=sec.items;let cats=[...new Set(items.map(i=>i.category))];let filtered=items.filter(i=>(!filters.q||[i.item,i.category,i.owner,i.notes].join(' ').toLowerCase().includes(filters.q.toLowerCase()))&&(filters.priority==='All'||i.priority===filters.priority)&&(filters.status==='All'||i.status===filters.status)&&(filters.category==='All'||i.category===filters.category)&&(filters.owner==='All'||i.owner===filters.owner));let st=stats(items);return `${header('Assessment checklist',esc(sec.name)+' checklist',`Track ${items.length} controls, assign accountability and capture evidence. Changes save automatically in this browser.`,btn('Export section CSV','sectioncsv')+btn('Reset filters','resetfilters'))}<div class="grid stats"><div class="card"><div class="statlabel">Completion</div><div class="statnum">${st.pct}%</div><div class="bar"><span style="width:${st.pct}%"></span></div></div><div class="card"><div class="statlabel">Completed</div><div class="statnum">${st.complete}</div><div class="statfoot">of ${items.length} total items</div></div><div class="card"><div class="statlabel">In progress</div><div class="statnum">${st.progress}</div><div class="statfoot">Currently being addressed</div></div><div class="card"><div class="statlabel">High priority open</div><div class="statnum" style="color:#b85b21">${st.highOpen}</div><div class="statfoot">Open high-priority controls</div></div></div><div class="toolbar"><input class="field search" id="q" placeholder="Search checklist items, categories, owners…" value="${esc(filters.q)}"><select class="field" id="priority"><option>All</option>${['High','Medium','Low'].map(x=>`<option ${filters.priority===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" id="status"><option>All</option>${['Not Started','In Progress','Complete','N/A'].map(x=>`<option ${filters.status===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" id="category"><option value="All">All categories</option>${cats.map(x=>`<option ${filters.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="field" id="owner"><option value="All">All owners</option>${[...new Set(items.map(i=>i.owner))].map(x=>`<option ${filters.owner===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="checklist-head"><b>${filtered.length} of ${items.length} items</b><span class="count">Select a control to mark it complete · Expand details to add evidence</span></div><div class="itemlist">${filtered.length?filtered.map(i=>itemCard(i)).join(''):'<div class="empty">No checklist items match these filters.</div>'}</div><div class="footer">Changes are saved automatically. Use Reports & exports to back up or transfer your assessment.</div>`}
function itemCard(i){let sid=esc(i.id);return `<article class="item ${i.status==='Complete'?'done':''}" data-id="${sid}"><button class="itemcheck" data-toggle="${sid}" title="Toggle complete">${i.status==='Complete'?'✓':''}</button><div class="itemmain"><div class="itemmeta"><span class="itemnum">#${i.number}</span><span class="cat">${esc(i.category)}</span><span class="tag ${i.priority}">${i.priority}</span></div><div class="itemtext">${esc(i.item)}</div><div class="mini">Owner: <span data-owner-label="${sid}">${esc(i.owner)}</span></div></div><select class="statusselect" data-status="${sid}">${['Not Started','In Progress','Complete','N/A'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select><button class="btn" style="padding:7px 9px" data-expand="${sid}">Details⌄</button><div class="itemdetails hidden" id="details-${sid}"><div><label>Owner</label><input data-field="owner" data-id="${sid}" value="${esc(i.owner)}" placeholder="Responsible owner"></div><div><label>Target date</label><input type="date" data-field="targetDate" data-id="${sid}" value="${esc(i.targetDate)}"></div><div><label>Evidence reference</label><input data-field="evidence" data-id="${sid}" value="${esc(i.evidence)}" placeholder="Document / ticket / link reference"></div><div style="grid-column:1/-1"><label>Evidence / test guidance</label><div class="mini" style="padding:8px;background:#f5f8fc;border-radius:7px">${esc(i.evidenceGuide||'Attach or reference evidence that demonstrates design and operating effectiveness.')}</div></div><div style="grid-column:1/-1"><label>Framework / reference mapping</label><div class="mini" style="padding:8px;background:#f5f8fc;border-radius:7px">${esc(i.framework||'Map to the standards, regulations and internal policies applicable to your organization.')}</div></div><div style="grid-column:1/-1"><label>Notes / action plan</label><textarea data-field="notes" data-id="${sid}" placeholder="Record assessment, gaps, remediation and decisions…">${esc(i.notes)}</textarea></div></div></article>`}
function workflow(){let steps=[['Scope the checklist','CIO, CTO, CISO, IT Infrastructure and cross-functional items defined','Planning'],['Load skill guidance','Read the workbook and PDF production guidance before formatting and tooling','Planning'],['Build data model','Single source of truth for category, item, priority and owner','Build'],['Generate Excel workbook','Tabs, dropdowns, conditional formatting and formulas','Build'],['Recalculate & validate','Recalculate formulas and verify expected results, not just formula errors','Build'],['Generate PDF','Cover page, contents, color-coded tables and checkboxes','Build'],['QA pass','Inspect XML escaping, glyph rendering, tables and formula behavior','QA'],['Fix & rebuild','Correct defects and regenerate affected deliverables','QA'],['Re-render & verify','Render every page and visually confirm fixes','Verified'],['Deliver files','Final workbook and PDF, with version and handoff notes','Verified']];return `${header('Production lifecycle','Build & validation workflow','A repeatable process from scoping through validated delivery, adapted from the supplied workflow diagram.',btn('Print workflow','print','primary'))}<div class="card" style="margin-bottom:16px"><h2 class="cardtitle">Workflow stages</h2><div class="carddesc">The original ten-step production sequence, with strengthened validation checkpoints.</div><div style="display:flex;gap:7px;flex-wrap:wrap"><span class="pill">Planning · 2 steps</span><span class="pill">Build · 4 steps</span><span class="pill" style="background:#fff3e1;color:#a96b12">QA · 2 steps</span><span class="pill" style="background:#edf7e7;color:#4f8735">Verified · 2 steps</span></div></div><div class="workflow">${steps.map((s,i)=>`<div class="step ${i===6||i===7?'warn':i>=8?'good':''}"><div class="stepnum">${i+1}</div><div class="stepbox"><h3>${s[0]}</h3><p>${s[1]}</p><small>${s[2]}</small></div></div>`).join('')}</div><div class="callout"><b>Framework applicability:</b> The expanded control library is a practical baseline, not a certification or legal opinion. Tailor controls to your organization, jurisdiction, sector, risk appetite and adopted standards; validate legal obligations with qualified counsel.<br><br><b>Important QA principle:</b> A workbook can contain zero formula errors and still calculate the wrong result. Validate formulas using test cases and expected outputs.</div>`}
function reports(){let a=allItems(),s=stats(a),sections=state.sections;return `${header('Management reporting','Reports & exports','Review readiness across leadership, enterprise architecture, security architecture, IT audit, GRC, compliance and system hardening.',btn('Export full CSV','fullcsv','primary')+btn('Download JSON backup','backup'))}<div class="grid stats"><div class="card"><div class="statlabel">Total controls</div><div class="statnum">${s.total}</div></div><div class="card"><div class="statlabel">Applicable completion</div><div class="statnum">${s.pct}%</div></div><div class="card"><div class="statlabel">Open high priority</div><div class="statnum" style="color:#b85b21">${s.highOpen}</div></div><div class="card"><div class="statlabel">N/A controls</div><div class="statnum">${s.na}</div></div></div><div class="card"><h2 class="cardtitle">Section summary</h2><div class="carddesc">Status and priority overview for the five checklist areas.</div><table class="reporttable"><thead><tr><th>Section</th><th>Items</th><th>Complete</th><th>In progress</th><th>Open high</th><th>Progress</th></tr></thead><tbody>${sections.map(sec=>{let x=stats(sec.items);return `<tr><td><b>${esc(sec.name)}</b></td><td>${x.total}</td><td>${x.complete}</td><td>${x.progress}</td><td style="color:#b85b21;font-weight:700">${x.highOpen}</td><td>${x.pct}%</td></tr>`}).join('')}</tbody></table></div><div class="card" style="margin-top:15px"><h2 class="cardtitle">Backup & restore</h2><div class="carddesc">Your assessment is stored in this browser's local storage. Export a JSON backup before clearing browser data or moving devices.</div><div class="actions">${btn('Download JSON backup','backup','primary')}<label class="btn" for="restoreFile">Restore from JSON</label><input id="restoreFile" type="file" accept="application/json,.json" class="hidden">${btn('Clear assessment data','clear','danger')}</div><p class="mini" style="margin-top:12px">Last saved: ${state.updatedAt?new Date(state.updatedAt).toLocaleString():'No changes yet'} · No information is sent to a server.</p></div>`}
function findItem(id){for(let s of state.sections){let i=s.items.find(x=>x.id===id);if(i)return i}return null}
function bind(){document.querySelectorAll('[data-goto]').forEach(x=>x.onclick=()=>nav('checklist',x.dataset.goto));document.querySelectorAll('[data-action]').forEach(x=>x.onclick=()=>action(x.dataset.action));let q=$('#q');if(q)q.oninput=()=>{filters.q=q.value;renderChecklistOnly()};['priority','status','category','owner'].forEach(k=>{let e=$('#'+k);if(e)e.onchange=()=>{filters[k]=e.value;renderChecklistOnly()}});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let i=findItem(b.dataset.toggle);i.status=i.status==='Complete'?'Not Started':'Complete';save();render()});document.querySelectorAll('[data-status]').forEach(e=>e.onchange=()=>{let i=findItem(e.dataset.status);i.status=e.value;save();render()});document.querySelectorAll('[data-expand]').forEach(b=>b.onclick=()=>{$('#details-'+b.dataset.expand).classList.toggle('hidden');b.textContent=$('#details-'+b.dataset.expand).classList.contains('hidden')?'Details⌄':'Close⌃'});document.querySelectorAll('[data-field]').forEach(e=>{e.onchange=()=>{let i=findItem(e.dataset.id);i[e.dataset.field]=e.value;save();if(e.dataset.field==='owner'){let l=document.querySelector(`[data-owner-label="${e.dataset.id}"]`);if(l)l.textContent=e.value}}});let f=$('#restoreFile');if(f)f.onchange=restore};
function renderChecklistOnly(){let old=page;render();let q=$('#q');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
function action(a){if(a==='print')window.print();if(a==='resetfilters'){filters={q:'',priority:'All',status:'All',category:'All',owner:'All'};render()}if(a==='backup')download('cio-cto-ciso-readiness-backup.json',JSON.stringify(state,null,2),'application/json');if(a==='fullcsv')download('cio-cto-ciso-full-assessment.csv',csv(allItems()),'text/csv');if(a==='sectioncsv')download(activeSection.toLowerCase().replaceAll(' ','-')+'-checklist.csv',csv(sectionByName(activeSection).items.map(i=>({...i,section:activeSection}))), 'text/csv');if(a==='clear'){if(confirm('Clear all saved assessment progress in this browser? Export a backup first if you need to retain it.')){state={sections:JSON.parse(JSON.stringify(BASE)),updatedAt:null};save();render();showToast('Assessment reset')}}}
function csv(items){let cols=['section','id','number','category','item','priority','status','owner','targetDate','evidence','evidenceGuide','framework','notes'];return [cols.join(','),...items.map(i=>cols.map(k=>'"'+String(i[k]??'').replaceAll('"','""')+'"').join(','))].join('\r\n')}
function download(name,content,type){let blob=new Blob([content],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);showToast('Export prepared')}
function restore(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!x.sections||!Array.isArray(x.sections))throw Error();state=mergeSections(x);save();render();showToast('Backup restored')}catch(err){alert('This file is not a valid Readiness Hub backup.')}};reader.readAsText(file)}
render();
</script></body></html>
