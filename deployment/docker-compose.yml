services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-readiness}
      POSTGRES_USER: ${POSTGRES_USER:-readiness_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - readiness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-readiness_app} -d ${POSTGRES_DB:-readiness}"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  readiness_pgdata:
